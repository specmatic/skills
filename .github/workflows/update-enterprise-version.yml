name: Update pinned Enterprise version

on:
  workflow_dispatch:
    inputs:
      enterprise-version:
        description: Specmatic Enterprise release version to pin
        required: true
        type: string

concurrency:
  group: update-enterprise-version
  cancel-in-progress: false

jobs:
  update_enterprise_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout skill repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.email "github-service-account@specmatic.io"
          git config user.name "Specmatic GitHub Service Account"

      - name: Update pinned Enterprise version
        env:
          ENTERPRISE_VERSION: ${{ inputs.enterprise-version }}
        run: |
          set -euo pipefail

          if [[ ! "${ENTERPRISE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+)?$ ]]; then
            echo "Invalid Enterprise version '${ENTERPRISE_VERSION}'. Expected X.Y.Z or X.Y.Z-suffix." >&2
            exit 1
          fi

          FILE="skills/generate-specmatic-sample/guides/specmatic-runtime.md"
          sed -i "s/^enterprise_cli_version:.*/enterprise_cli_version: ${ENTERPRISE_VERSION}/" "$FILE"
          sed -i "s/^enterprise_docker_tag:.*/enterprise_docker_tag: ${ENTERPRISE_VERSION}/" "$FILE"
          sed -i "s/^enterprise_native_jvm_version:.*/enterprise_native_jvm_version: ${ENTERPRISE_VERSION}/" "$FILE"

      - name: Commit and push
        env:
          ENTERPRISE_VERSION: ${{ inputs.enterprise-version }}
        run: |
          set -euo pipefail

          FILE="skills/generate-specmatic-sample/guides/specmatic-runtime.md"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "Pinned Enterprise version is already ${ENTERPRISE_VERSION}."
          else
            git commit -m "chore(generate-specmatic-sample): pin Enterprise ${ENTERPRISE_VERSION}"
            git push
          fi
